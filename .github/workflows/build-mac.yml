name: Build plugin (macOS + Windows)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

# Брендинг: везде RogerThat без пробелов — имя в DAW, файлы, папки, архивы.

jobs:
  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build
        run: cmake --build build --config Release -j4 --target RogerThat_VST3 RogerThat_AU

      - name: Ad-hoc codesign and package
        run: |
          set -e
          ART=build/RogerThat_artefacts/Release
          ls -R "$ART" | head -50
          codesign --force --deep -s - "$ART/VST3/RogerThat.vst3"
          codesign --force --deep -s - "$ART/AU/RogerThat.component"
          PKG="RogerThat-macOS"
          mkdir -p "$PKG"
          cp -R "$ART/VST3/RogerThat.vst3" "$ART/AU/RogerThat.component" "$PKG/"
          cat > "$PKG/README.txt" <<'EOF'
          RogerThat — radio / walkie-talkie voice effect
          macOS (VST3 + AU)

          INSTALL
          1. Copy RogerThat.vst3 to /Library/Audio/Plug-Ins/VST3/
             (Finder: Go -> Go to Folder... -> paste the path).
             If an old GuitarSuite3.vst3 is there, delete it — it is the same plugin.
             RogerThat.component (AU) goes to /Library/Audio/Plug-Ins/Components/ — only needed for Logic / GarageBand.
          2. Open Terminal and run this line (removes the "downloaded from the internet" flag):
             sudo xattr -dr com.apple.quarantine /Library/Audio/Plug-Ins/VST3/RogerThat.vst3
          3. Restart your DAW. Look for RogerThat by vst34.

          --
          vst34
          Created by Yevhenii Bondar (Р3ЙМ4Н)
          iamyevheniibondar@gmail.com
          EOF
          # --keepParent: в архив попадает сама папка «RogerThat-macOS», при распаковке она и появится
          ditto -c -k --keepParent --sequesterRsrc "$PKG" RogerThat-macOS.zip
          unzip -l RogerThat-macOS.zip | head -20

      - uses: actions/upload-artifact@v4
        with:
          name: RogerThat-macOS
          path: RogerThat-macOS.zip

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --target RogerThat_VST3

      - name: Package
        shell: pwsh
        run: |
          $art = "build/RogerThat_artefacts/Release"
          Get-ChildItem -Recurse $art | Select-Object FullName | Select-Object -First 40
          $pkg = "RogerThat-Windows"
          New-Item -ItemType Directory -Force $pkg | Out-Null
          Copy-Item -Recurse "$art/VST3/RogerThat.vst3" "$pkg/"
          $txt = @"
          RogerThat — radio / walkie-talkie voice effect
          Windows (VST3)

          INSTALL
          1. Copy the whole RogerThat.vst3 folder to C:\Program Files\Common Files\VST3\
             (Explorer will ask for administrator permission — click Continue).
          2. Restart your DAW (FL Studio, Ableton, Cubase, Studio One, Reaper...) and rescan plugins if needed.
             Look for RogerThat by vst34.

          --
          vst34
          Created by Yevhenii Bondar (Р3ЙМ4Н)
          iamyevheniibondar@gmail.com
          "@
          [IO.File]::WriteAllText("$pkg/README.txt", $txt, (New-Object System.Text.UTF8Encoding $true))
          Compress-Archive -Path $pkg -DestinationPath RogerThat-Windows.zip
          Get-ChildItem RogerThat-Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: RogerThat-Windows
          path: RogerThat-Windows.zip

  release:
    needs: [mac, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: RogerThat-macOS
      - uses: actions/download-artifact@v4
        with:
          name: RogerThat-Windows
      - name: Publish as "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la *.zip
          gh release delete latest --cleanup-tag -y || true
          gh release create latest RogerThat-macOS.zip RogerThat-Windows.zip \
            --title "RogerThat (latest build)" \
            --notes "macOS: VST3 + AU (arm64+x86_64, ad-hoc signed). Windows: VST3 (x64). See README.txt inside the archive."
