name: Build plugin (macOS + Windows)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

# Брендинг: везде RogerThat без пробелов — имя в DAW, файлы, папки, архивы.

jobs:
  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build
        run: cmake --build build --config Release -j4 --target RogerThat_VST3 RogerThat_AU RogerThat_Standalone

      - name: Ad-hoc codesign and package
        run: |
          set -e
          ART=build/RogerThat_artefacts/Release
          ls -R "$ART" | head -50
          codesign --force --deep -s - "$ART/VST3/RogerThat.vst3"
          codesign --force --deep -s - "$ART/AU/RogerThat.component"
          codesign --force --deep -s - "$ART/Standalone/RogerThat.app"
          PKG="RogerThat-macOS"
          mkdir -p "$PKG"
          cp -R "$ART/VST3/RogerThat.vst3" "$ART/AU/RogerThat.component" "$ART/Standalone/RogerThat.app" "$PKG/"
          cat > "$PKG/УСТАНОВКА.txt" <<'EOF'
          RogerThat (vst34) — установка на macOS

          1. Скопировать RogerThat.vst3 в /Library/Audio/Plug-Ins/VST3/
             (Finder: Переход -> Переход к папке... -> вставить путь).
             Если там лежит старый GuitarSuite3.vst3 — удалить его, это тот же плагин.
             AU-версия (RogerThat.component) — в /Library/Audio/Plug-Ins/Components/, нужна только для Logic/GarageBand.
          2. Открыть Терминал и выполнить (снимает пометку «скачано из интернета»):
             sudo xattr -dr com.apple.quarantine /Library/Audio/Plug-Ins/VST3/RogerThat.vst3
          3. Перезапустить DAW. Плагин: RogerThat (производитель vst34).
          EOF
          # --keepParent: в архив попадает сама папка «RogerThat-macOS», при распаковке она и появится
          ditto -c -k --keepParent --sequesterRsrc "$PKG" RogerThat-macOS.zip
          unzip -l RogerThat-macOS.zip | head -20

      - uses: actions/upload-artifact@v4
        with:
          name: RogerThat-macOS
          path: RogerThat-macOS.zip

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --target RogerThat_VST3 RogerThat_Standalone

      - name: Package
        shell: pwsh
        run: |
          $art = "build/RogerThat_artefacts/Release"
          Get-ChildItem -Recurse $art | Select-Object FullName | Select-Object -First 40
          $pkg = "RogerThat-Windows"
          New-Item -ItemType Directory -Force $pkg | Out-Null
          Copy-Item -Recurse "$art/VST3/RogerThat.vst3" "$pkg/"
          Copy-Item "$art/Standalone/RogerThat.exe" "$pkg/"
          $txt = @"
          RogerThat (vst34) — установка на Windows

          1. Скопировать папку RogerThat.vst3 целиком в C:\Program Files\Common Files\VST3\
             (Проводник спросит разрешение администратора — нажать «Продолжить»).
          2. Перезапустить DAW (FL Studio, Ableton, Cubase, Studio One, Reaper...) и при необходимости
             пересканировать плагины. Плагин: RogerThat (производитель vst34).
          RogerThat.exe — автономная версия для быстрой проверки без DAW (звук с микрофона/линейного входа).
          "@
          [IO.File]::WriteAllText("$pkg/УСТАНОВКА.txt", $txt, (New-Object System.Text.UTF8Encoding $true))
          Compress-Archive -Path $pkg -DestinationPath RogerThat-Windows.zip
          Get-ChildItem RogerThat-Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: RogerThat-Windows
          path: RogerThat-Windows.zip

  release:
    needs: [mac, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: RogerThat-macOS
      - uses: actions/download-artifact@v4
        with:
          name: RogerThat-Windows
      - name: Publish as "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la *.zip
          gh release delete latest --cleanup-tag -y || true
          gh release create latest RogerThat-macOS.zip RogerThat-Windows.zip \
            --title "RogerThat (latest build)" \
            --notes "macOS: VST3 + AU + Standalone (arm64+x86_64, ad-hoc signed). Windows: VST3 + Standalone (x64). См. УСТАНОВКА.txt внутри архива."
